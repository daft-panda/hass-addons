[package]
name = "ebus-thermostat"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustls = { version = "0.23.45", features = ["logging", "std", "ring"], default-features = false }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.5", default-features=false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
anyhow = "1.0.104"
futures-util = "0.3.34"
env_logger = "0.11.11"
log = "0.4.34"
clap = { version = "4.6.7", features = ["derive"] }
